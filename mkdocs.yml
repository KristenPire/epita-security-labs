site_name: Computer Security — EPITA · Labs
site_description: Hands-on labs for the EPITA Computer Security course. HTTPS and password storage.
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.footer
    - navigation.top

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - "Class 5 — HTTPS & passwords":
      - "Lab 1 — HTTPS for NotesApp": class5/https-lab.md
      - "Lab 2A — Crack weak hashes": class5/password-crack.md
      - "Lab 2B — Fix it with Argon2": class5/password-fix.md
